<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 히로시마 : 이쓰쿠시마 도리이 (그라데이션 스타일) -->
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="55%" stop-color="#8F7BF3"/>
      <stop offset="100%" stop-color="#C9A8F7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7B8CF0" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#EEEEF2" stroke-width="3"/>
  <g filter="url(#soft)">
    <!-- 가사기(곡선 지붕) -->
    <path d="M62 176 C 150 128, 362 128, 450 176 L 432 216 C 350 176, 162 176, 80 216 Z" fill="url(#g)"/>
    <!-- 시마키(받침보) -->
    <rect x="102" y="222" width="308" height="28" rx="13" fill="url(#g)"/>
    <!-- 기둥(살짝 벌어짐) -->
    <path d="M150 252 L128 446" stroke="url(#g)" stroke-width="44" stroke-linecap="round"/>
    <path d="M362 252 L384 446" stroke="url(#g)" stroke-width="44" stroke-linecap="round"/>
    <!-- 누키(가로보) -->
    <rect x="116" y="308" width="280" height="26" rx="12" fill="url(#g)"/>
    <!-- 중앙 현판 -->
    <rect x="238" y="256" width="36" height="46" rx="9" fill="url(#g)"/>
  </g>
</svg>
